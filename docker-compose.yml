services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guitarra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guitarra}
      POSTGRES_DB: ${POSTGRES_DB:-guitarra}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VITE_GUITAR_API_TOKEN: ${GUITAR_API_TOKEN:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guitarra}:${POSTGRES_PASSWORD:-guitarra}@db:5432/${POSTGRES_DB:-guitarra}
      GUITAR_API_TOKEN: ${GUITAR_API_TOKEN:-}
      GUITAR_WORKER_TOKEN: ${GUITAR_WORKER_TOKEN:-}
      GUITAR_JOB_LEASE_SECONDS: ${GUITAR_JOB_LEASE_SECONDS:-300}
      GUITAR_AUDIO_DIR: /data/audio
      GUITAR_AUDIO_MAX_BYTES: ${GUITAR_AUDIO_MAX_BYTES:-209715200}
    volumes:
      - audio:/data/audio
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  audio:
