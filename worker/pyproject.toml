[project]
name = "guitarra-worker"
version = "0.1.0"
description = "Worker de análisis de canciones de la App de Práctica de Guitarra"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scipy>=1.11",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Modelos de análisis (torch CPU lo instala install.ps1 desde el índice de PyTorch)
analysis = ["beat-this>=1.1", "safetensors>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
