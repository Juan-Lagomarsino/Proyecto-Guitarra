[project]
name = "guitarra-worker"
version = "0.1.0"
description = "Worker de análisis de canciones de la App de Práctica de Guitarra"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scipy>=1.11",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Modelos de análisis: beat_this (tempo) y BTC (acordes). torch CPU lo instala install.ps1
# desde el índice de PyTorch.
analysis = [
    "beat-this>=1.1",
    "safetensors>=0.4",
    "numpy>=2",
    "librosa>=0.10",
    "mir_eval>=0.7",
    "pyyaml>=6",
]
# Separación de pistas (acompañamiento sin guitarra, ADR 0015). Aparte de `analysis` porque es
# pesado y opcional: sin él el análisis anda igual y la separación falla con un mensaje claro.
# Usa el torch CPU que instala install.ps1.
separation = ["demucs>=4.0.1"]
# Transcripción de riffs (ADR 0017). Son las dependencias livianas de basic-pitch; el paquete en
# sí se instala aparte con `--no-deps` (declara tensorflow<2.15.1, que no existe para 3.12):
# `pip install basic-pitch==0.4.0 --no-deps` (lo hace install.ps1). Usa el modelo ONNX del paquete.
riffs = [
    "onnxruntime>=1.16",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",
    "resampy>=0.4",
    "scikit-learn>=1.3",
    "mido>=1.3",
    "six",
    "importlib_resources",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guitarra_worker = ["strum/catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
